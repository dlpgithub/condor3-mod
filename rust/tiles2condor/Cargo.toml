[package]
name = "tiles2condor"
version = "0.1.0"
edition = "2021"
description = "Build a Condor 3 landscape from 3D Tiles exports (Rust port of tools/tiles2condor.py)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rayon = "1"
md5 = "0.7"

[profile.release]
opt-level = 3
